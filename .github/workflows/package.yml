name: Package

# Builds the installers on every push, so any commit can be downloaded and tried: open the run
# under Actions and take the files from its Artifacts. A tag such as v0.2.0 also publishes them as
# a GitHub release under that version.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./build/package-windows.ps1 -Runtime win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-windows-x64
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Signs with the Developer ID and notarises when these secrets are set (see the README);
      # without them the app is signed ad hoc, as before.
      - name: Set up signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: ./build/macos/setup-ci-signing.sh

      - name: Package
        env:
          CASTORICE_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          CASTORICE_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          CASTORICE_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          CASTORICE_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          CASTORICE_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./build/package-macos.sh ${{ matrix.rid }}

      - name: Remove signing material
        if: always()
        run: ./build/macos/cleanup-ci-signing.sh

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-${{ matrix.rid }}
          path: artifacts/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package
        run: ./build/package-linux.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-linux-x64
          path: |
            artifacts/*.AppImage
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.0.0-beta.1 and the like go out as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
