name: Package

# Builds the installers on every push, so any commit can be downloaded and tried: open the run
# under Actions and take the files from its Artifacts. A tag such as v0.2.0 also publishes them as
# a GitHub release under that version.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./build/package-windows.ps1 -Runtime win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-windows-x64
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Signs with the Developer ID and notarises when these secrets are set (see the README);
      # without them the app is signed ad hoc, as before.
      - name: Set up signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: ./build/macos/setup-ci-signing.sh

      - name: Package
        env:
          CASTORICE_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          CASTORICE_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          CASTORICE_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          CASTORICE_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          CASTORICE_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./build/package-macos.sh ${{ matrix.rid }}

      - name: Remove signing material
        if: always()
        run: ./build/macos/cleanup-ci-signing.sh

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-${{ matrix.rid }}
          path: artifacts/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "CASTORICE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package
        run: ./build/package-linux.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: castorice-linux-x64
          path: |
            artifacts/*.AppImage
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The app updates to whatever GitHub marks as the latest release, which by default is the
      # newest one published. A patch for an older line (0.1.1 after 0.2.0) must not take that
      # mark, or 0.1.0 users would be offered 0.1.1 instead of 0.2.0.
      - name: Decide whether this is the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            echo "Pre-release $version is never the latest."
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Published releases only: drafts, pre-releases and tags without a release do not count.
          released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          highest="$(printf '%s\n' $released "$TAG" | sed 's/^v//' | grep -E '^[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -n 1)"

          if [[ "$highest" == "$version" ]]; then
            echo "$version is the highest release: marking it as the latest."
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$version is below $highest: $highest stays the latest release."
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.0.0-beta.1 and the like go out as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
